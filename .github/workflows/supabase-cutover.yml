name: Supabase cutover build

on:
  push:
    branches: [supabase-cutover]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
      - name: Verify static output
        run: test -f out/index.html && test -f out/login/index.html
